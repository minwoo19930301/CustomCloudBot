<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f2fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="초대 기반 공동 봇 대화" />
    <link rel="preload" href="/icons/cloud-agent-v1-192.png" as="image">
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon-v2-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/app-icon-v2-180.png" sizes="180x180" />
    <title>CustomCloudBot</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/branch-graph.css" />
    <link rel="stylesheet" href="/routines.css" />
    <link rel="stylesheet" href="/voice-call.css" />
    <link rel="stylesheet" href="/desktop.css" />
    <link rel="stylesheet" href="/setup.css" />
    <link rel="stylesheet" href="/mail.css" />
    <link rel="stylesheet" href="/agent-presence.css" />
    <link rel="stylesheet" href="/notification-center.css" />
    <link rel="stylesheet" href="/profile-settings.css" />
    <link rel="stylesheet" href="/room-sharing.css" />
    <link rel="stylesheet" href="/glass.css" />
    <link rel="stylesheet" href="/mobile-workspace.css" />
  </head>
  <body>
    <svg
      class="icon-definitions"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
    >
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M7 10H4v11h16V10h-3"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="m15 3 6 6-4 1-4 4v4l-3-3-6 6 6-6-3-3h4l4-4z"/></symbol>
      <symbol id="i-fork" viewBox="0 0 24 24"><path d="M4 12h6l8-8m-8 8 8 8M13 4h5v5m-5 11h5v-5"/></symbol>
      <symbol id="i-merge" viewBox="0 0 24 24"><path d="M6 4v6a4 4 0 0 0 4 4h8M14 10l4 4-4 4M6 20v-2"/></symbol>
      <symbol id="i-agent" viewBox="0 0 24 24"><path d="M7 4h10a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 10v3m8-3v3m-7 4h6M10 4V2m4 2V2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-7-7l2-2-2-5Z"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14v11H9l-4 3V5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c0 6-3 9-9 9 6 0 9 3 9 9 0-6 3-9 9-9-6 0-9-3-9-9Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 4 4" />
      </symbol>
      <symbol id="i-people" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3" />
        <path
          d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"
        />
      </symbol>
      <symbol id="i-invite" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3" />
        <path d="M3 20v-2a6 6 0 0 1 12 0v2M19 8v6M16 11h6" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M12 19V5m-6 6 6-6 6 6" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M6 18 18 6" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="3" />
        <path d="M9 4v16" />
      </symbol>
      <symbol id="i-join" viewBox="0 0 24 24">
        <path
          d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5M3 12h12m-4-4 4 4-4 4"
        />
      </symbol>
      <symbol id="i-bot" viewBox="0 0 24 24">
        <rect x="4" y="7" width="16" height="13" rx="5" />
        <path d="M12 3v4M8 12v3M16 12v3" />
      </symbol>
      <symbol id="i-attach" viewBox="0 0 24 24">
        <path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7" />
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="8" y="3" width="8" height="12" rx="4" />
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6" />
      </symbol>
    </svg>
    <div id="app">
      <section id="startup-view" class="startup-view" aria-label="CustomCloudBot 불러오는 중">
        <img class="icon agent-art startup-logo" src="/icons/cloud-agent-v1-192.png" alt="" width="144" height="144" fetchpriority="high" decoding="sync" draggable="false">
        <strong data-product-name>CustomCloudBot</strong>
        <p id="startup-status" role="status">내 공간을 불러오고 있어요</p>
        <button id="startup-retry" class="is-hidden" type="button">다시 시도</button>
        <noscript>JavaScript를 켜면 내 공간에 연결할 수 있습니다.</noscript>
      </section>
      <section id="auth-view" class="auth-view is-hidden" aria-labelledby="auth-title">
        <div class="auth-panel">
          <div class="auth-brand">
            <img class="brand-art auth-logo" src="/icons/cloud-agent-v1-192.png" alt="" width="96" height="96" draggable="false">
            <h1 id="auth-title" data-product-name>CustomCloudBot</h1>
          </div>
          <p class="auth-description">초대받은 계정으로 로그인하세요.</p>
          <div class="auth-tabs" role="tablist" aria-label="인증 방식">
            <button
              class="tab-button is-active"
              type="button"
              data-auth-tab="login"
              role="tab"
              aria-selected="true"
            >
              로그인
            </button>
            <button
              class="tab-button"
              type="button"
              data-auth-tab="register"
              role="tab"
              aria-selected="false"
            >
              초대 가입
            </button>
          </div>
          <form id="login-form" class="auth-form">
            <label for="login-username">사용자 이름</label
            ><input
              id="login-username"
              name="username"
              autocomplete="username"
              required
              maxlength="40"
            />
            <label for="login-password">비밀번호</label
            ><input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="10"
            />
            <button class="primary-button full" type="submit">로그인</button>
          </form>
          <form id="register-form" class="auth-form is-hidden">
            <label for="register-display">표시 이름</label
            ><input
              id="register-display"
              name="displayName"
              autocomplete="name"
              required
              maxlength="60"
            />
            <label for="register-username">사용자 이름</label
            ><input
              id="register-username"
              name="username"
              autocomplete="username"
              required
              maxlength="40"
              placeholder="영문, 숫자, 밑줄 3자 이상"
            />
            <label for="register-password"
              >비밀번호 <span class="hint">10자 이상</span></label
            ><input
              id="register-password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="10"
            />
            <label id="register-token-label" for="register-token">가입 초대 코드</label
            ><input
              id="register-token"
              name="inviteToken"
              autocomplete="off"
              required
            />
            <button class="primary-button full" type="submit">
              계정 만들기
            </button>
          </form>
          <p
            id="auth-message"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>
          <button id="auth-install-button" class="outline-button auth-install-button is-hidden" type="button">홈 화면에 추가</button>
        </div>
      </section>
      <section id="workspace-view" class="workspace-view is-hidden">
        <aside id="sidebar" class="sidebar" aria-label="대화 목록">
          <div id="sidebar-resizer" class="sidebar-resizer" role="separator" tabindex="0" aria-label="대화 목록 너비 조절" aria-controls="sidebar" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="420" aria-valuenow="280" aria-disabled="true"></div>
          <div class="sidebar-header">
            <div id="agent-presence" class="agent-presence" aria-label="에이전트"></div>
            <div class="sidebar-actions">
              <button id="sidebar-new-session" class="icon-button" type="button" aria-label="새 세션" title="새 세션"><svg class="icon"><use href="#i-plus" /></svg></button>
              <div id="notification-center"></div>
              <button id="sidebar-search-toggle" class="icon-button" type="button" aria-label="세션 검색" title="세션 검색" aria-expanded="false" aria-controls="sidebar-search-wrap"><svg class="icon"><use href="#i-search" /></svg></button>
              <button
                id="mobile-close"
                class="icon-button mobile-only"
                type="button"
                aria-label="메뉴 닫기"
              >
                <svg class="icon"><use href="#i-close" /></svg>
              </button>
            </div>
          </div>
          <div id="sidebar-search-wrap" class="sidebar-search-wrap" hidden><input id="session-search" type="search" placeholder="세션 검색" aria-label="세션 검색" autocomplete="off" /></div>
          <button id="create-sidebar-group" type="button" hidden disabled>+ 그룹</button>
          <nav id="room-list" class="room-list" aria-label="대화 분기 그래프"></nav>
          <div class="sidebar-bottom">
            <div class="profile-row">
              <button id="profile-customize" class="profile-customize profile-menu-trigger" type="button" aria-label="계정 및 도구 메뉴" aria-haspopup="dialog" aria-expanded="false" aria-controls="profile-menu">
              <div id="profile-avatar" class="avatar">?</div>
              <div class="profile-copy">
                <strong id="profile-name">사용자</strong
                ><span id="profile-role"></span>
              </div>
              <span class="profile-menu-chevron" aria-hidden="true">⌃</span>
              </button>
            </div>
            <dialog id="profile-menu" class="profile-menu" aria-label="계정 및 도구">
              <div class="profile-menu-section">
                <span class="profile-menu-heading">내 공간</span>
                <button id="edit-profile-button" class="profile-menu-item" type="button">프로필 꾸미기</button>
                <button id="notification-settings-button" class="profile-menu-item" type="button">알림 설정</button>
                <button id="create-room-button" class="profile-menu-item" type="button">새 대화</button>
                <button id="restore-conversations" class="profile-menu-item" type="button">대화 복원</button>
              </div>
              <div class="profile-menu-section">
                <span class="profile-menu-heading">도구</span>
                <button id="open-dashboard" class="profile-menu-item is-hidden" type="button">대시보드</button>
                <button id="open-mail" class="profile-menu-item is-hidden" type="button" data-admin-tool>메일</button>
                <button id="open-capability-hub" class="profile-menu-item is-hidden" type="button" data-admin-tool>통합 관리</button>
                <button id="open-bot-setup" class="profile-menu-item is-hidden" type="button" data-admin-tool>내 봇 설정</button>
                <button id="open-routines" class="profile-menu-item" type="button">루틴</button>
              </div>
              <div class="profile-menu-section">
                <button id="site-invite-button" class="profile-menu-item is-hidden" type="button">사용자 초대</button>
                <button id="install-button" class="profile-menu-item is-hidden" type="button">앱으로 설치</button>
                <button id="logout-button" class="profile-menu-item" type="button">로그아웃</button>
              </div>
            </dialog>
          </div>
        </aside>
        <div id="sidebar-scrim" class="sidebar-scrim"></div>
        <main class="main-panel">
          <header class="topbar">
            <div class="topbar-leading">
            <button
              id="mobile-menu"
              class="icon-button"
              type="button"
              aria-label="사이드바 접기/펼치기" aria-expanded="true"
            >
              <svg class="icon"><use href="#i-menu" /></svg>
            </button>
            <div class="header-identity">
              <h1 id="room-title">대화</h1>
            </div>
            </div>
            <span id="mobile-room-title" class="sr-only"></span
            ><span id="room-kicker" class="sr-only"></span>
            <div class="topbar-actions">
              <span
                id="demo-badge"
                class="demo-badge is-hidden"
                title="실제 AI가 연결되지 않은 기능 미리보기"
                >데모 · 실제 AI 미연결</span
              ><button
                id="members-toggle"
                class="icon-button members-button" hidden
                type="button"
                aria-label="참여자 보기"
                title="참여자"
              >
                <svg class="icon" aria-hidden="true"><use href="#i-people" /></svg><span id="member-count">0</span></button
              ><button
                id="room-invite-button"
                class="icon-button is-hidden" hidden
                type="button"
                aria-label="대화에 초대"
                title="대화에 초대"
              >
                <svg class="icon"><use href="#i-invite" /></svg>
              </button>
              <button id="voice-call-button" class="icon-button voice-call-button" type="button" aria-label="이 대화에 전화하기" title="이 대화에 전화하기"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg></button>
              <button id="room-share-button" class="icon-button room-share-button" type="button" aria-label="대화 공유 및 다운로드" title="공유" disabled><svg class="icon" aria-hidden="true"><use href="#i-share"/></svg></button>
              <button id="room-actions-button" class="icon-button room-actions-button" type="button" aria-label="대화 메뉴" title="고정·삭제" aria-haspopup="menu" aria-expanded="false" disabled><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button>
            </div>
          </header>
          <div id="pane-grid" class="pane-grid" data-panes="1">
          <section id="empty-state" class="empty-state">
            <h2>새 대화</h2>
            <p>대화를 만들어 시작하세요.</p>
            <button
              id="empty-create-button"
              class="outline-button"
              type="button"
            >
              대화 만들기
            </button>
          </section>
          <section
            id="room-view"
            class="room-view is-hidden"
            aria-labelledby="room-title"
          >
            <div
              id="model-warning"
              class="model-warning is-hidden"
              role="status"
            >
              AI 모델이 연결되지 않았습니다. 메시지는 참여자들과 공유됩니다.
            </div>
            <div
              id="message-list"
              class="message-list"
              aria-live="polite"
              aria-label="대화 내용"
            ></div>
            <div class="composer-dock">
              <div
                id="sending-status"
                class="sending-status"
                role="status"
                aria-live="polite"
              ></div>
              <form id="composer-form" class="composer">
                <div class="composer-tools"></div>
                <div class="composer-row">
                  <label class="sr-only" for="message-input">메시지 입력</label>
                  <textarea id="message-input" rows="1" maxlength="4000" placeholder="무엇을 함께 해볼까요?"></textarea>
                </div>
                <div id="attachment-list" class="attachment-list" aria-live="polite"></div>
                <div class="composer-footer" role="group" aria-label="메시지 도구">
                  <button id="attach-button" class="bot-picker-button attach-button" type="button" aria-label="사진 또는 음성 첨부" title="사진 또는 음성 첨부">
                    <svg class="icon"><use href="#i-attach" /></svg>
                  </button>
                  <input id="attachment-input" class="sr-only" type="file" accept="image/*,audio/*" multiple />
                  <button id="record-button" class="bot-picker-button record-button" type="button" aria-label="음성 녹음 시작" title="음성 녹음">
                    <svg class="icon"><use href="#i-mic" /></svg>
                  </button>
                  <button id="record-cancel-button" class="record-cancel-button" type="button" hidden>취소</button>
                  <div class="model-controls">
                  <label><span class="sr-only">모델</span><select id="model-select" class="model-select" aria-label="모델"><option value="">자동 선택</option></select></label>
                  <label><span class="sr-only">effort</span><select id="effort-select" class="effort-select" aria-label="effort"><option value="">기본</option><option value="low">낮음</option><option value="medium">보통</option><option value="high">높음</option><option value="xhigh">최대</option></select></label>
                </div>
                  <button id="send-button" class="send-button" type="submit" aria-label="메시지 보내기">
                    <svg class="icon"><use href="#i-arrow" /></svg>
                  </button>
                </div>
              </form>
              <div class="composer-caption">
                <span id="usage-label"></span>
              </div>
            </div>
          </section>
          </div>
        </main>
        <aside id="member-panel" class="member-panel" aria-label="대화 참여자">
          <div class="member-panel-head">
            <h2>참여자</h2>
            <button
              id="member-close"
              class="icon-button"
              type="button"
              aria-label="참여자 패널 닫기"
            >
              <svg class="icon"><use href="#i-close" /></svg>
            </button>
          </div>
          <p id="room-description" class="room-description"></p>
          <div id="member-list" class="member-list"></div>
        </aside>
      </section>
    </div>
    <dialog id="room-dialog" class="modal">
      <form id="room-form">
        <div class="modal-head">
          <h2>새 대화</h2>
          <button
            class="icon-button modal-close"
            type="button"
            aria-label="닫기"
          >
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </div>
        <label for="room-name">이름</label
        ><input
          id="room-name"
          name="name"
          required
          maxlength="80"
          autocomplete="off"
        /><label for="room-description-input"
          >설명 <span class="hint">선택</span></label
        ><textarea
          id="room-description-input"
          name="description"
          maxlength="240"
          rows="3"
        ></textarea>
        <p id="room-form-message" class="form-message" role="status"></p>
        <div class="modal-actions">
          <button class="outline-button modal-cancel" type="button">취소</button
          ><button class="primary-button" type="submit">만들기</button>
        </div>
      </form>
    </dialog>
    <dialog id="image-dialog" class="image-dialog">
      <button id="image-dialog-close" class="icon-button" type="button" aria-label="이미지 닫기">
        <svg class="icon"><use href="#i-close" /></svg>
      </button>
      <img id="image-dialog-image" alt="첨부 이미지" />
    </dialog>
    <dialog id="join-dialog" class="modal">
      <form id="join-form">
        <div class="modal-head">
          <h2>대화에 참여</h2>
          <button
            class="icon-button modal-close"
            type="button"
            aria-label="닫기"
          >
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </div>
        <p id="join-invite-note" class="modal-copy is-hidden">초대받은 대화에 참여할까요?</p>
        <label id="join-token-label" for="join-token">대화 초대 코드</label
        ><input
          id="join-token"
          name="token"
          required
          autocomplete="off"
          spellcheck="false"
        />
        <p id="join-form-message" class="form-message" role="status"></p>
        <div class="modal-actions">
          <button class="outline-button modal-cancel" type="button">취소</button
          ><button class="primary-button" type="submit">참여하기</button>
        </div>
      </form>
    </dialog>
    <dialog id="invite-dialog" class="modal invite-modal">
      <form method="dialog">
        <div class="modal-head">
          <h2>초대 링크</h2>
          <button
            class="icon-button modal-close"
            type="button"
            aria-label="닫기"
          >
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </div>
        <p class="eyebrow sr-only"></p>
