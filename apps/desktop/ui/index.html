<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
  <title>CustomCloudBot</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <div class="app-name"><img src="app-logo.png" alt="">CustomCloudBot</div>
    <div class="connection"><span id="status-dot" class="status-dot"></span><span id="connection-label">내 컴퓨터 연결 꺼짐</span></div>
    <nav>
      <button id="external-link" hidden>외부 링크 열기</button>
      <button id="toolbar-pause" hidden>일시정지</button>
      <button id="show-app" hidden>대화로 돌아가기</button>
      <button id="show-settings" hidden>설정</button>
    </nav>
  </header>
  <main id="setup" hidden>
    <section class="settings-card" aria-label="데스크톱 설정">
      <h1>내 컴퓨터 연결</h1>
      <p class="description">이 Mac에서 봇이 사용할 기능을 선택하세요.</p>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <button id="retry-storage" class="storage-retry" type="button">암호 저장소 다시 확인</button>
      <label for="service-url">서비스 주소</label>
      <div class="input-action"><input id="service-url" type="url" placeholder="https://your-bot.example.com" autocomplete="url" spellcheck="false"><button id="login">서비스 열기</button></div>
      <label for="computer-name">컴퓨터 이름</label>
      <input id="computer-name" type="text" maxlength="80" autocomplete="off" placeholder="내 Mac">
      <h2>허용할 기능</h2>
      <label class="capability"><span><strong>선택한 폴더의 파일</strong><small>파일 목록 · 읽기 · 저장</small></span><input id="cap-files" type="checkbox"></label>
      <div id="folder-panel" class="folder-panel" hidden><ul id="folders"></ul><button id="choose-folders">폴더 선택</button></div>
      <label class="capability"><span><strong>터미널 명령 실행</strong><small>현재 Mac 계정으로 실행 · 선택 폴더 밖에도 접근 가능</small></span><input id="cap-terminal" type="checkbox"></label>
      <label class="capability"><span><strong>브라우저에서 링크 열기</strong><small>Mac의 기본 브라우저 사용</small></span><input id="cap-browser" type="checkbox"></label>
      <p class="scope-note">요청한 파일 내용과 실행 결과가 연결한 서비스로 전달됩니다.</p>
      <div class="connection-actions"><button id="revoke" class="danger" hidden>연결 해제</button><button id="pause" hidden>일시정지</button><button id="connect" class="primary">연결 허용</button></div>
      <details id="os-permissions" hidden><summary>macOS 파일 접근 설정</summary><p>보호된 폴더에 접근할 수 없을 때 macOS 설정에서 권한을 확인하세요.</p><button data-permission="files">시스템 설정 열기</button></details>
    </section>
  </main>
</body>
</html>
