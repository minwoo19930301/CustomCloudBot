name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify portable fork defaults
        run: |
          node --test scripts/test-audit-fork.mjs
          node scripts/audit-fork.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Validate deployment command
        run: |
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
          python3 -m unittest discover -s apps/community/deploy -p 'test_configuration.py'
          python3 -m unittest discover -s apps/community/deploy/provisioner -p 'test_service.py'
          python3 -m unittest discover -s apps/community/deploy/host-admin -p 'test_*.py'
          python3 -m unittest discover -s apps/community/deploy/mobile -p 'test_vm_support.py'
      - name: Test native workspace bridge
        run: |
          python3 -m venv "$RUNNER_TEMP/workspace-tests"
          "$RUNNER_TEMP/workspace-tests/bin/pip" install aiohttp==3.14.4
          "$RUNNER_TEMP/workspace-tests/bin/python" -m unittest discover -s apps/community/deploy/desktop -p 'test_workspace_bridge.py'
      - name: Test browser-only window layout
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb openbox x11-utils pulseaudio pulseaudio-utils ffmpeg
          sh -n apps/community/deploy/desktop/entrypoint.sh
          python3 -m unittest discover -s apps/community/deploy/desktop -p 'test_browser_display.py' -v
          python3 -m unittest discover -s apps/community/deploy/desktop -p 'test_media_runtime.py' -v
          "$RUNNER_TEMP/workspace-tests/bin/python" -m unittest discover -s apps/community/deploy/desktop -p 'test_media_bridge.py' -v

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.OCI_DEPLOY_READY == 'true' && vars.OCI_DEPLOY_REPOSITORY == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: oci-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.OCI_PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy tested main commit
        env:
          SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
          OCI_DEPLOY_REPOSITORY: ${{ vars.OCI_DEPLOY_REPOSITORY }}
          OCI_DEPLOY_HOST: ${{ vars.OCI_DEPLOY_HOST }}
          OCI_DEPLOY_USER: ${{ vars.OCI_DEPLOY_USER }}
          OCI_PUBLIC_ORIGIN: ${{ vars.OCI_PUBLIC_ORIGIN }}
          RELEASE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/deploy/workflow_config.py
          test -n "$SSH_KEY"
          target="$OCI_DEPLOY_USER@$OCI_DEPLOY_HOST"
          umask 077
          key="$RUNNER_TEMP/oci-deploy-key"
          hosts="$RUNNER_TEMP/oci-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$hosts"
          args=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes
                -o UserKnownHostsFile="$hosts" -o ConnectTimeout=20
                -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          if ssh "${args[@]}" "$target" id > "$RUNNER_TEMP/deploy-boundary-check" 2>&1; then
            echo 'Deployment key unexpectedly permits arbitrary commands.'
            exit 1
          fi
          grep -q 'Expected a full lowercase Git commit SHA' "$RUNNER_TEMP/deploy-boundary-check"
          rm -f "$RUNNER_TEMP/deploy-boundary-check"
          echo 'Restricted deployment key verified.'
          ssh "${args[@]}" "$target" "$RELEASE"
      - name: Verify public HTTPS release and assets
        env:
          EXPECTED_SHA: ${{ github.sha }}
          OCI_PUBLIC_ORIGIN: ${{ vars.OCI_PUBLIC_ORIGIN }}
        run: python3 scripts/deploy/verify-public.py
